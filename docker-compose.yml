services:
  postgres:
    image: postgres:16
    container_name: valhalla-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - valhalla
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: DockerfileDev
    container_name: valhalla-app-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - valhalla
    environment:
      # APP_DB_HOST, not DB_HOST: the app still receives DB_HOST, but Compose must not read
      # it from the shell env, or a host-side DB_HOST=localhost (Jetty, scripts/gate.ps1)
      # would point this container at itself instead of at the postgres service.
      DB_HOST: ${APP_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECURITY_SECRET: ${SECURITY_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Base publica para los meta tags OG (link previews). Si no se pone, el app cae a
      # APP_BASE_URL y, sin ninguna de las dos, al origen de la request.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-planit@localhost}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: sh docker-dev.sh
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  maven_cache:
    driver: local

networks:
  valhalla:
    driver: bridge
