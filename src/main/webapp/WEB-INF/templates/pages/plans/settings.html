<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layouts/base :: headContent('Configuración del plan')}"></th:block>
</head>
<body th:replace="~{layouts/base :: layout(~{::main})}">
<main class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
  <a th:href="@{/plans/{id}(id=${plan.id})}" class="text-blue-600 hover:underline">Volver al plan</a>
  <h1 class="mt-4 text-3xl font-bold">Configuración del plan</h1>
  <p class="mt-2 text-gray-600" th:text="${plan.name}"></p>
  <p th:if="${param.saved != null}" role="status" class="mt-4 rounded-lg bg-green-50 p-4 text-green-900">Configuración guardada.</p>
  <form th:action="@{/plans/{id}/settings(id=${plan.id})}" method="post" class="mt-6 space-y-6 rounded-xl border p-6">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div>
      <label for="share-link" class="block font-semibold">Compartir link</label>
      <select id="share-link" name="shareLink" class="mt-2 w-full rounded-md border p-2" aria-describedby="share-help">
        <option value="OWNER" th:selected="${plan.settings.shareLink.name() == 'OWNER'}">Solo dueño (solicitudes deshabilitadas)</option>
        <option value="EDITORS" th:selected="${plan.settings.shareLink.name() == 'EDITORS'}">Dueño y editores</option>
        <option value="PARTICIPANTS" th:selected="${plan.settings.shareLink.name() == 'PARTICIPANTS'}">Todos los participantes</option>
      </select>
      <p id="share-help" class="mt-2 text-sm text-gray-500">En un plan privado, habilitar el link permite ver un resumen y solicitar participación. No da acceso al itinerario.</p>
    </div>
    <div>
      <label for="handle-requests" class="block font-semibold">Gestionar solicitudes</label>
      <select id="handle-requests" name="handleRequests" class="mt-2 w-full rounded-md border p-2">
        <option value="OWNER" th:selected="${plan.settings.handleRequests.name() == 'OWNER'}">Solo dueño</option>
        <option value="EDITORS" th:selected="${plan.settings.handleRequests.name() == 'EDITORS'}">Dueño y editores</option>
      </select>
    </div>
    <button type="submit" class="rounded-md bg-primary px-4 py-2 font-medium text-white">Guardar configuración</button>
  </form>
</main>
</body>
</html>
