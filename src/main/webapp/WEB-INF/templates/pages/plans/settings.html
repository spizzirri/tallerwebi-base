<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layouts/base :: headContent('Configuración del plan')}"></th:block>
</head>
<body th:replace="~{layouts/base :: layout(~{::main})}">
<main class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
  <a th:href="@{/plans/{id}(id=${plan.id})}" class="text-blue-600 hover:underline">Volver al plan</a>
  <h1 class="mt-4 text-3xl font-bold">Configuración del plan</h1>
  <p class="mt-2 text-gray-600" th:text="${plan.name}"></p>
  <p th:if="${param.saved != null}" role="status" class="mt-4 rounded-lg bg-green-50 p-4 text-green-900">Configuración guardada.</p>
  <form th:action="@{/plans/{id}/settings(id=${plan.id})}" method="post" class="mt-6 space-y-6 rounded-xl border p-6">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div th:replace="~{components/plan-permissions :: selectors(${plan.settings}, '')}"></div>
    <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2 font-medium text-white">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
        <path d="M17 21v-8H7v8" />
        <path d="M7 3v5h8" />
      </svg>
      Guardar configuración
    </button>
  </form>
</main>
</body>
</html>
