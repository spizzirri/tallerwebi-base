<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/base :: head('Home')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 flex flex-col items-center justify-center gap-4 p-4">
    <h1 class="text-3xl font-semibold text-gray-900">Welcome to Taller Web 1</h1>

    <p class="text-gray-600">
      You are signed in as <span class="font-medium text-gray-900" sec:authentication="name">email</span>
    </p>

    <div id="session-clock-app" th:attr="data-login-time=${loginTime}"
      class="rounded-lg bg-white px-4 py-3 text-sm text-gray-700 shadow-md">
      Signed in for <span class="font-medium text-gray-900">{{ elapsed }}</span>
    </div>

    <a th:href="@{/admin/home}" class="text-blue-600 hover:underline">Reload</a>

    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const elapsed = ref('0:00');
          const pad = (n) => String(n).padStart(2, '0');
          onMounted(() => {
            const loginTime = Number(document.getElementById('session-clock-app').dataset.loginTime);
            const update = () => {
              const total = Math.floor(Math.max(0, Date.now() - loginTime) / 1000);
              const hours = Math.floor(total / 3600);
              const minutes = Math.floor((total % 3600) / 60);
              elapsed.value = (hours ? pad(hours) + ':' : '') + pad(minutes) + ':' + pad(total % 60);
            };
            setInterval(update, 1000);
            update();
          });
          return { elapsed };
        }
      }).mount('#session-clock-app');
    </script>
  </main>

</body>

</html>
