<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head(null)}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 flex items-center justify-center p-4">
    <div id="register-app" class="w-full max-w-md rounded-lg bg-white p-8 shadow-md"
      th:attr="data-error=${error}">
      <form ref="form" @submit.prevent="submit" action="#" th:action="@{/admin/register}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <h3 class="mb-2 text-2xl font-semibold text-gray-900">New User</h3>
        <hr class="mb-6 border-gray-200">
        <div class="flex gap-4">
          <div class="flex-1">
            <label for="firstName" class="mb-1 block text-sm font-medium text-gray-700">First Name</label>
            <input v-model="firstName" id="firstName" name="firstName" type="text" autocomplete="given-name"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="flex-1">
            <label for="lastName" class="mb-1 block text-sm font-medium text-gray-700">Last Name</label>
            <input v-model="lastName" id="lastName" name="lastName" type="text" autocomplete="family-name"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
        </div>
        <div class="mt-4">
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Email</label>
          <input v-model="email" id="email" name="email" type="email" autocomplete="username"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>
        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
          <input v-model="password" type="password" id="password" name="password" autocomplete="new-password"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>
        <button id="btn-register" type="submit" :disabled="loading"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
          <span v-if="loading">Registering...</span>
          <span v-else>Register</span>
        </button>
        <p v-if="error" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700">{{ error }}</p>
      </form>
    </div>
    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const data = document.getElementById('register-app').dataset;
          const firstName = ref('');
          const lastName = ref('');
          const email = ref('');
          const password = ref('');
          const error = ref(data.error || '');
          const loading = ref(false);
          const form = ref(null);
          const submit = () => { loading.value = true; form.value.submit(); };
          return { firstName, lastName, email, password, error, loading, form, submit };
        }
      }).mount('#register-app');
    </script>
  </main>

</body>

</html>
