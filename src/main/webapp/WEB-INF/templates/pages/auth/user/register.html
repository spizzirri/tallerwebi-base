<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Crear Cuenta - PlanIt')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <h1 class="mb-6 text-2xl font-semibold text-gray-900">Crear Cuenta</h1>

      <p th:if="${errorMessage}" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700"
        th:text="${errorMessage}"></p>

      <form th:action="@{/auth/register}" th:object="${registerRequest}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="flex gap-4">
          <div class="flex-1">
            <label for="firstName" class="mb-1 block text-sm font-medium text-gray-700">Nombre</label>
            <input type="text" id="firstName" th:field="*{firstName}" autocomplete="given-name" required
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="mt-1 block text-sm text-red-600"></span>
          </div>
          <div class="flex-1">
            <label for="lastName" class="mb-1 block text-sm font-medium text-gray-700">Apellido</label>
            <input type="text" id="lastName" th:field="*{lastName}" autocomplete="family-name" required
              class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="mt-1 block text-sm text-red-600"></span>
          </div>
        </div>

        <div class="mt-4">
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input type="email" id="email" th:field="*{email}" autocomplete="username" required autofocus
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 block text-sm text-red-600"></span>
        </div>

        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 block text-sm text-red-600"></span>
          <p class="mt-1 text-xs text-gray-500">Mínimo 6 caracteres.</p>
        </div>

        <div class="mt-4">
          <label for="confirmPassword" class="mb-1 block text-sm font-medium text-gray-700">Repetir contraseña</label>
          <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 block text-sm text-red-600"></span>
        </div>

        <!-- [PROF] PROF-015: avatar opcional al registrarse. El partial forja el input
             name=avatarUrl: lo toma RegisterRequest igual que los otros campos. -->
        <div class="mt-4">
          <div th:replace="~{components/avatar-picker :: picker(${registerRequest.avatarUrl})}"></div>
        </div>

        <button id="btn-register" type="submit"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700">
          Registrarme
        </button>
      </form>

      <p class="mt-6 text-sm text-gray-600">
        ¿Ya tienes cuenta? <a th:href="@{/auth/login}" class="text-blue-600 hover:underline">Inicia sesión aquí</a>
      </p>
    </div>
  </main>

</body>

</html>
