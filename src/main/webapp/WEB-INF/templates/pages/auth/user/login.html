<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Iniciar Sesión - PlanIt')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <h1 class="mb-6 text-2xl font-semibold text-gray-900">Iniciar Sesión</h1>

      <p th:if="${error}" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700">
        Email o contraseña inválidos.
      </p>
      <p th:if="${param.logout}" class="rounded-md bg-green-100 px-4 py-3 text-sm text-green-700">
        Has cerrado sesión con éxito.
      </p>

      <form th:action="@{/auth/validate-login}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <!-- El navbar anonimo pasa ?redirect=<pagina de origen>; el POST del form lo reenvia al
             success handler para que el login vuelva a donde estaba (no a la landing). -->
        <input type="hidden" name="redirect" th:value="${param.redirect[0]}" th:if="${param.redirect != null}">

        <div class="mt-4">
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input type="email" id="email" name="username" autocomplete="username" required autofocus
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="mt-4">
          <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <button id="btn-login" type="submit"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700">
          Ingresar
        </button>
      </form>

      <div class="mt-6 space-y-2 text-sm">
        <p>
          <a th:href="@{/auth/forgot-password}" class="text-blue-600 hover:underline">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="text-gray-600">
          ¿No tienes cuenta? <a th:href="@{/auth/register}" class="text-blue-600 hover:underline">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </main>

</body>

</html>
