<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Cambiar contrasena - PlanIt')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <h1 class="mb-6 text-2xl font-semibold text-gray-900">Cambiar contrasena</h1>

      <!-- [PROF] AC-06/AC-07/AC-08: pide la actual (obligatoria) y la nueva dos veces; la
           comparacion del hash y la escritura las maneja UserService.changePassword. El POST
           no lleva id: el usuario es el de la sesion (AC-04). -->

      <form th:action="@{/profile/change-password}" th:object="${changePasswordForm}" method="POST" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
          <label for="currentPassword" class="mb-1 block text-sm font-medium text-gray-700">Contrasena actual</label>
          <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password"
            required class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"
            class="mt-1 block text-sm text-red-600"></span>
        </div>

        <div>
          <label for="newPassword" class="mb-1 block text-sm font-medium text-gray-700">Contrasena nueva</label>
          <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
            class="mt-1 block text-sm text-red-600"></span>
          <p class="mt-1 text-xs text-gray-500">Minimo 8 caracteres.</p>
        </div>

        <div>
          <label for="confirmPassword" class="mb-1 block text-sm font-medium text-gray-700">Repetir contrasena nueva</label>
          <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
            class="mt-1 block text-sm text-red-600"></span>
        </div>

        <button type="submit"
          class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
            <path d="M17 21v-8H7v8" />
            <path d="M7 3v5h8" />
          </svg>
          Guardar contrasena
        </button>
      </form>

      <p class="mt-6 text-sm text-gray-600">
        <a th:href="@{/profile}" class="text-blue-600 hover:underline">Volver a mi perfil</a>
      </p>
    </div>
  </main>

</body>

</html>
