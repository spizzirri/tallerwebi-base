<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared page chrome: head fragment used directly by every page, plus the
     layout(content) decorator that wraps a page-provided <main> with the
     navbar. Pages call: layouts/base :: layout(~{::main})

     The head's body is exposed separately as headContent(pageTitle) so a page that owns
     its <head> (pages/plans/detail.html, which needs Bootstrap and leaflet before the
     Tailwind stack) can keep its own tags first and still inherit the shared metas,
     tokens and scripts. head(pageTitle) delegates to it. -->

<head th:fragment="head(pageTitle)">
  <!-- CSRF para el JS de fetch: add-to-plan.js y pages/places-list.js leen estos
       metas para el POST a /api/plans/{id}/places. Van acá, en el head completo de la app, y
       no en headContent: la vista pública read-only (pages/plans/public.html, que hereda
       headContent) no debe exponer el token. [_csrf] puede ser null en páginas públicas. -->
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <th:block th:replace="~{layouts/base :: headContent(${pageTitle})}"></th:block>
</head>

<th:block th:fragment="headContent(pageTitle)">
  <th:block th:replace="~{layouts/base :: previewMeta(${pageTitle})}"></th:block>
  <th:block th:replace="~{layouts/base :: headTail(${pageTitle})}"></th:block>
</th:block>

<!-- El preview vive aparte del resto del head: las páginas con <head> propio
     (pages/plans/public.html) lo insertan antes de sus stylesheets, para que los og* queden
     al principio del head (los scrapers no ejecutan CSS ni JS y algunos cortan la lectura
     si el head es largo), sin duplicar el resto del headContent. -->
<th:block th:fragment="previewMeta(pageTitle)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Vista previa al compartir el link. Los scrapers de WhatsApp, Discord y Teams leen Open
       Graph; Twitter/X leen la tarjeta propia. Van todos en el HTML que responde el servidor:
       estos bots no ejecutan JS. Van primero en el head, antes del script de tema y de los
       stylesheets, porque algunos bots cortan la lectura de metas si el head es muy largo. Las
       URLs salen absolutas desde el bean siteOrigin, que arma la base con PUBLIC_BASE_URL si
       está configurada (túnel/producción) o con la request si no (ver BaseWebConfig). -->
  <meta property="og:type" th:content="${ogType != null ? ogType : 'website'}">
  <meta property="og:site_name" content="PlanIt">
  <meta property="og:title" th:content="${ogTitle != null} ? ${ogTitle} : (${pageTitle != null} ? ${pageTitle} : 'PlanIt')">
  <meta property="og:description" th:content="${ogDescription != null}
    ? ${ogDescription}
    : (${pageDescription != null}
      ? ${pageDescription}
      : 'Discover and plan your perfect day in Buenos Aires')">
  <meta property="og:url" th:if="${ogUrl != null}" th:content="${@siteOrigin.absolute(ogUrl)}">
  <meta property="og:image" th:content="${@siteOrigin.absolute(ogImage != null ? ogImage : '/images/og-image.png')}">
  <meta property="og:image:secure_url" th:content="${@siteOrigin.absolute(ogImage != null ? ogImage : '/images/og-image.png')}">
  <!-- Alt de la imagen: WhatsApp lo pide para accesibilidad y suma a la tarjeta grande. El
       preview del plan es su portada, asi que se describe con el mismo titulo (plan · creador). -->
  <meta property="og:image:alt" th:content="${ogTitle != null} ? ${ogTitle} : (${pageTitle != null} ? ${pageTitle} : 'PlanIt')">
  <!-- Dimensiones y tipo: el endpoint de preview del plan garantiza JPG 1200x630; la imagen de
       marca es PNG del mismo tamaño; sin ogImageType (páginas que no definen preview) se declaran
       igual los valores de la marca. -->
  <th:block th:if="${ogImage == null || ogImageType != null}">
    <meta property="og:image:type" th:content="${ogImageType != null ? ogImageType : 'image/png'}">
    <meta property="og:image:width" th:content="${ogImageWidth != null ? ogImageWidth : 1200}">
    <meta property="og:image:height" th:content="${ogImageHeight != null ? ogImageHeight : 630}">
  </th:block>
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" th:content="${ogTitle != null} ? ${ogTitle} : (${pageTitle != null} ? ${pageTitle} : 'PlanIt')">
  <meta name="twitter:description" th:content="${ogDescription != null}
    ? ${ogDescription}
    : (${pageDescription != null}
      ? ${pageDescription}
      : 'Discover and plan your perfect day in Buenos Aires')">
  <meta name="twitter:image" th:content="${@siteOrigin.absolute(ogImage != null ? ogImage : '/images/og-image.png')}">
</th:block>

<th:block th:fragment="headTail(pageTitle)">
  <!-- Modo oscuro: el tema se resuelve acá, en línea y antes de cualquier stylesheet, para que
       la primera pintura ya salga con el modo elegido y no haya destello claro. La precedencia
       es preferencia del usuario > localStorage > sistema:
       - [PROF+THEME] autenticado: el servidor emite <meta name="theme-preference"> con su
         themePreference (CurrentUserControllerAdvice.userThemePreference), así la elección
         viaja entre dispositivos sin depender del storage del browser.
       - [THEME] anónimo (sin meta): la decisión vive en localStorage bajo la clave
         "planit-theme"; si nunca eligió, sigue al sistema. El anónimo no tiene control de
         tema: no hay botón en el navbar.
       Escribe dos atributos con el mismo valor: data-theme es el que encienden los overrides
       de brand.css, y data-bs-theme es la misma llave en la sintaxis que lee Bootstrap (solo
       pages/plans/detail.html carga Bootstrap). El click del toggle del navbar (solo sesión
       iniciada) se atiende por delegación de eventos: el botón se renderiza después y así el
       script no se repite en el body. Ese toggle no persiste acá: su form hace un POST a
       /profile/theme, porque la preferencia del servidor manda sobre localStorage. El handler
       solo aplica el modo y deja el valor en el hidden del form antes del submit. Claves de
       icono y overrides viven en brand.css y components/navbar.html. -->
  <meta name="theme-preference" th:if="${userThemePreference != null}"
    th:content="${userThemePreference}">
  <script>
    (function () {
      let stored = null;
      try { stored = localStorage.getItem("planit-theme"); } catch (e) { /* sin storage */ }
      const meta = document.querySelector('meta[name="theme-preference"]');
      const preferred = meta ? meta.getAttribute("content") : null;
      let initial;
      if (preferred === "dark" || preferred === "light") {
        initial = preferred;
      } else if (stored === "dark" || stored === "light") {
        initial = stored;
      } else {
        initial = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      const apply = function (mode) {
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.setAttribute("data-bs-theme", mode);
      };
      apply(initial);
      document.addEventListener("click", function (event) {
        const toggle = event.target.closest && event.target.closest("[data-theme-toggle]");
        if (!toggle) return;
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        apply(next);
        try { localStorage.setItem("planit-theme", next); } catch (e) { /* sin storage */ }
        // [PROF+THEME] El toggle del navbar es type=submit dentro de #navbar-theme-form: el
        // submit nativo sigue despues de este handler y serializa sus hidden. Poner el valor
        // aca hace que el POST lleve el modo que el usuario acaba de ver aplicado.
        const field = document.getElementById("navbar-theme-value");
        if (field) field.value = next;
      });
    })();
  </script>

  <title th:text="${pageTitle != null} ? ${pageTitle} : 'PlanIt'">PlanIt</title>
  <!-- pageTitle es el único parámetro del fragmento, para no romper las llamadas de una sola
       variable de las demás páginas. La descripción se resuelve desde el modelo: la landing
       define pageDescription y el resto de las páginas caen en el texto genérico. -->
  <meta name="description" th:content="${pageDescription != null}
    ? ${pageDescription}
    : 'Discover and plan your perfect day in Buenos Aires'">

  <!-- El botón de compartir resuelve la URL del plan contra este origen en vez de
       window.location.origin: detrás de ngrok el link público no es el host que ve el
       navegador. Con PUBLIC_BASE_URL sin configurar, es el origen de la página (localhost). -->
  <meta name="public-base-url" th:content="${@siteOrigin.base()}">

  <!-- Barra del navegador en mobile, del color del navbar. El manifest da nombre e ícono
       al "agregar a pantalla de inicio"; apple-touch-icon es aparte porque iOS no acepta
       SVG para eso y aplica su propia máscara, por eso el PNG va a sangre completa.
       El manifest va como /manifest.json y no como .webmanifest porque Spring sirve esa
       extensión como application/octet-stream y el navegador descarta el manifest entero.
       El #111827 repite el token --black de brand.css: un meta y un JSON no leen var(),
       así que son el único hex de la marca que no puede salir de brand.css. -->
  <meta name="theme-color" content="#111827">
  <link rel="manifest" th:href="@{/manifest.json}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">

  <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">

  <!-- Webfonts from Google Fonts: the sans that body wears, and the serif the design tokens
       expose as --font-serif. display=swap is not optional: without it the text stays
       invisible until the font arrives, on top of the reveal shield below. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Josefin+Sans:ital,wght@0,300..700;1,300..700&display=swap">
   

  <!-- Design tokens: brand colors, category colors and the font family live in
       resources/css/brand.css, declared once and inherited by every page through
       this fragment. The category colors are read back from JS via
       getComputedStyle(document.documentElement).getPropertyValue('--category-*');
       their keys match the PlaceCategory enum values. -->
  <link rel="stylesheet" th:href="@{/css/brand.css}">

  <!-- Tailwind's view of the same tokens. This block carries no color of its own: every
       entry points at the --primary / --secondary / --category-* variables declared in
       brand.css, which stay the single source of truth. Only brand values are mapped here:
       the neutrals stay Tailwind's default gray scale, which is why there is no
       --color-gray-500 remapping. It lives inline because the vendored browser build
       only compiles style[type="text/tailwindcss"] read from the DOM (see
       resources/core/js/tailwind-browser.js): a @theme in an external stylesheet is never
       processed. The payoff is the utility names: bg-primary, text-category-restaurant
       and friends become real Tailwind classes instead of arbitrary-value brackets. -->
  <style type="text/tailwindcss">
    @theme {
      --color-white: var(--white);
      --color-black: var(--black);
      --color-gray: var(--gray);
      --color-primary: var(--primary);
      --color-secondary: var(--secondary);

      --color-category-restaurant: var(--category-restaurant);
      --color-category-bar: var(--category-bar);
      --color-category-cafe: var(--category-cafe);
      --color-category-museum: var(--category-museum);
      --color-category-park: var(--category-park);
      --color-category-shopping: var(--category-shopping);
      --color-category-nightlife: var(--category-nightlife);
      --color-category-culture: var(--category-culture);
      --color-category-sport: var(--category-sport);
      --color-category-other: var(--category-other);

      --font-sans: var(--typeface-sans);
      --font-serif: var(--typeface-serif);
    }

    /* [CAL] Calificaciones (16-CAL.md): estilos de los fragments de components/rating.html,
       aca para que cualquier pagina que use el indicador o el widget no los repita.
       Indicador: la capa amarilla se clipa con overflow hidden y width = promedio/5,
       asi 4.5 cubre el 90% de la fila, sin JS ni glifos de media estrella.
       Estrella SVG: se mide en em para seguir la font-size del contenedor
       (text-2xl en la vista del plan, text-base en las cards). */
    .rating-stars-base {
      color: #d1d5db;
    }

    .rating-stars-fill {
      position: absolute;
      inset: 0;
      color: #f59e0b;
      overflow: hidden;
      white-space: nowrap;
    }

    .star-glyph {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
    }

    /* [CAL] Widget de voto (components/rating :: widget). Los radios van escondidos y el DOM
       en orden inverso (5..1) con flex-row-reverse: la fila se ve 1..5, pero el combinator ~
       pinta cada estrella junto con las DOM-previas a ella, que son las de valor menor: asi
       hover y checked rellenan hasta esa estrella incluida. El hover avisa la interactividad
       (AC-09) y, cuando la capa amarilla esta mostrando el promedio, hover sobre el widget
       la esconde para que el preview de radios tome el control. */
    .rating-star {
      color: #d1d5db;
      transition:
        color 0.15s ease,
        opacity 0.15s ease;
    }

    .rating-star-option:has(input:checked) .rating-star,
    .rating-star-option:has(input:checked) ~ .rating-star-option .rating-star {
      color: #f59e0b;
    }

    .rating-star-option:hover .rating-star,
    .rating-star-option:hover ~ .rating-star-option .rating-star {
      color: #f59e0b;
      opacity: 0.7;
    }

    .rating-star-option:focus-within .rating-star {
      outline: 2px solid #f59e0b;
      outline-offset: 2px;
      border-radius: 9999px;
    }

    .rating-widget:hover .rating-stars-fill {
      visibility: hidden;
    }

    /* La variante anonima del widget es el link al login: el hover de la fila completa
       avisa que las estrellas se pueden clikear, igual que el hover de los radios. */
    .rating-widget-anon {
      transition: opacity 0.15s ease;
    }

    .rating-widget-anon:hover {
      opacity: 0.7;
    }
  </style>

  <!-- Tailwind compiled in the browser: the vendored @tailwindcss/browser script
       scans the rendered DOM and injects the generated CSS (no build step).
       The shield below hides the page until the styles are ready, so there is
       no unstyled flash; it always falls back to visible after 3 seconds. -->
  <style>
    html {
      visibility: hidden;
    }

    /* [FLASH] Vue renders its templates in the browser: until each root calls mount(), the
       v-if/v-for directives and the {{ }} bindings are inert HTML and would be painted as-is
       (raw placeholders, hidden-by-v-if blocks and modals). display:none instead of
       visibility keeps those nodes out of layout, so they cannot flash. Vue removes the
       attribute from the root as soon as mount() returns.

       The 3 s fallback below strips any v-cloak left over, so a page whose script never ran
       ends up showing its raw template (what it does today) instead of a permanently blank
       region. */
    [v-cloak] {
      display: none !important;
    }
  </style>
  <script th:src="@{/js/tailwind-browser.js}" defer></script>
  <script th:src="@{/js/vue.global.prod.js}"></script>
  <script th:src="@{/js/toasts.js}" defer></script>
  <script defer>
    (function () {
      /* Reveal when Tailwind has injected its generated stylesheet, not when a <style> is
         "big enough": the @theme source block above is already ~3 KB and used to satisfy the
         old length test, revealing the page ~15 ms in, while the compiler was still running.
         The generated sheet is the only head <style> carrying the "! tailwindcss vX.Y.Z"
         banner (resources/core/js/tailwind-browser.js). */
      const stylesReady = function () {
        const styles = document.querySelectorAll("head style");
        for (let i = 0; i < styles.length; i++) {
          if (styles[i].textContent.indexOf("tailwindcss v") !== -1) return true;
        }
        return false;
      };

      /* Lifting the shield says nothing about Vue: it only means the CSS is there. v-cloak must
         survive this path and be cleared by mount(), or the raw template is painted in the gap
         between the reveal and the mount (the bug this was supposed to fix). */
      const reveal = function () {
        document.documentElement.style.visibility = "visible";
      };

      /* Escape hatch, 3 s: either Tailwind never compiled or the view's script never mounted.
         Showing a raw template beats a blank page. */
      const fallback = function () {
        const pending = document.querySelectorAll("[v-cloak]");
        for (let i = 0; i < pending.length; i++) pending[i].removeAttribute("v-cloak");
        reveal();
      };

      const waitForStyles = function () {
        if (stylesReady()) { reveal(); return; }
        setTimeout(waitForStyles, 15);
      };

      setTimeout(waitForStyles, 15);
      setTimeout(fallback, 3000);
    })();
  </script>
  <script th:if="${devReloadToken != null}" th:inline="javascript" defer>
    (function () {
      const endpoint = /*[[@{/reload/version}]]*/ "";
      const expected = /*[[${devReloadToken}]]*/ "";
      if (!endpoint || !expected) return;
      const poll = function () {
        fetch(endpoint, { cache: "no-store" })
          .then(function (r) {
            if (r.ok) return r.text();
            setTimeout(poll, 1200);
          })
          .then(function (token) {
            if (token === undefined) return;
            if (token !== expected) { location.reload(); return; }
            setTimeout(poll, 1200);
          })
          .catch(function () { setTimeout(poll, 1200); });
      };
      setTimeout(poll, 1200);
    })();
  </script>
</th:block>

<body th:fragment="layout(content)" class="bg-gray-100 min-h-screen flex flex-col">

  <span hidden data-toast th:if="${successToast}" th:text="${successToast}"></span>
  <nav th:replace="~{components/navbar}"></nav>

  <!-- [PROF] Menú del navbar: hermano del <nav>, no hijo, así que el conteo de items de los
       helpers E2E ("body > nav a, body > nav button") no lo ve. -->
  <div th:replace="~{components/navbar-menu}"></div>

  <!-- [MARK] Error del toggle optimista: si la API falla, el icono vuelve al estado anterior
       y este aviso explica el motivo. role="alert" lo anuncia sin mover el foco. -->
  <div id="bookmark-alert" role="alert" aria-live="assertive" aria-atomic="true"
    class="fixed bottom-6 left-1/2 z-50 hidden w-[92vw] max-w-lg -translate-x-1/2 rounded-lg border border-red-200 bg-white p-4 text-sm text-red-700 shadow-lg">
    <div class="flex items-start gap-3">
      <p id="bookmark-alert-message" class="flex-1"></p>
      <button type="button" data-bookmark-alert-close aria-label="Cerrar aviso"
        class="shrink-0 rounded p-0.5 text-red-500 transition hover:bg-red-50 hover:text-red-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <th:block th:replace="${content}"></th:block>

  <!-- [MARK] Toggle de Guardados: intercepta el submit de las vistas server-rendered y usa la API
       sin recargar. Tambien concentra la confirmacion al quitar (incluido el POST nativo de la
       card del perfil). Sin JS el form sigue funcionando. -->
  <script type="module" th:src="@{/js/bookmark-toggle.js}"></script>

</body>

</html>
