<!-- [MOBILE] flex-wrap: en pantallas angostas el segundo bloque (links) baja a su propia fila
     en vez de forzar scroll horizontal (AC-01/AC-02 de 22-MOBILE).
     [DIS] AC-06: sticky top-0 + z-50 dejan la barra fija durante el scroll en landing y app,
     desde el fragmento único (una sola declaración, todas las páginas). El skip-link del
     landing va después en el orden de fuente y, con el mismo z-50, pinta encima al enfocarse;
     los modales del sitio (navbar-menu z-[1100], detalle del explorador z-[1100]) siguen por
     encima, como los tenía /explore con su sticky propio. -->
<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 bg-black px-4 text-white shadow">

  <!-- Logo principal: a /admin/home cuando el navbar rinde la variante admin (rol ADMIN
       dentro de /admin/**), a / en el resto. La variante se decide por rol Y por el área que se
       está visitando (CurrentUserControllerAdvice.showAdminNav): un ADMIN en /explore usa el
       navbar de usuario. El color sale del token de marca, declarado en resources/css/brand.css
       y expuesto a Tailwind por el bloque @theme de layouts/base :: head. La clase navbar-brand
       se conserva porque es el hook que leen los tests del navbar. -->
  <a class="navbar-brand inline-flex items-center gap-2 py-3 font-serif text-xl font-bold text-secondary hover:text-white"
    th:if="${showAdminNav}" th:href="@{/admin/home}">
    <!-- [FLASH] width/height fijos: logo.svg declara 1366x768 y sin width/height el browser
         lo pinta a su tamano intrínseco hasta que Tailwind aplica h-12 w-12. Los atributos
         reservan la caja final desde el primer frame; las clases siguen mandando. -->
    <img th:src="@{/images/logo.svg}" alt="Logo" width="48" height="48"
      class="h-12 w-12 object-contain" />
    <span>PlanIt</span>
  </a>
  <a class="navbar-brand inline-flex items-center gap-2 py-3 font-serif text-xl font-bold text-secondary hover:text-white"
    th:unless="${showAdminNav}" th:href="@{/}">
    <img th:src="@{/images/logo.svg}" alt="Logo" width="48" height="48"
      class="h-12 w-12 object-contain" />
    <span>PlanIt</span>
  </a>

  <!-- [PPV] "Para vos" es el feed /for-you y aparece SIEMPRE en el navbar de usuario, con y sin
       sesion (excepto la variante admin): es la puerta de descubrimiento del producto. El link
       duplica en los dos bloques porque el nav es flex de dos hijos (marca + menu) y sacarlo
       romperia el layout; los labels viven en WebPage.getNavbarItems para los E2E. -->
  <!-- [MOBILE] Hamburguesa del menu: solo con sesion (el E2E pinnea que el navbar anonimo NO la
       tiene) y solo por debajo de md. Abre el mismo modal del avatar via data-menu-toggle, asi
       que no hay JS nuevo: los destinos viajan dentro de #navbar-menu (bloque md:hidden).
       Sin texto en el contenido (aria-label) para que getNavbarItems no la cuente en desktop.
       ml-auto empuja el par [hamburguesa][toggle] contra el canto derecho en mobile, ahora
       que el toggle es el ultimo hijo del nav. -->
  <button type="button" id="navbar-menu-btn" data-menu-toggle="navbar-menu"
    sec:authorize="isAuthenticated()"
    class="navbar-menu-btn md:hidden ml-auto inline-flex h-11 w-11 items-center justify-center rounded-md bg-primary hover:bg-secondary"
    aria-label="Abrir menu" aria-haspopup="true" aria-expanded="false" aria-controls="navbar-menu">
    <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Usuario AUTENTICADO: en mobile los links se esconden (van al menu de la hamburguesa).
       md:ml-auto mantiene este cluster contra el canto derecho en desktop aunque el nav suma
       un tercer hijo visible (el form del toggle de tema). -->
  <div sec:authorize="isAuthenticated()" class="hidden md:flex md:ml-auto items-center gap-4 text-sm">
    <!-- Front door to the admin panel; the only destination an admin needs, and only while
         inside /admin/**. Outside that area the admin gets the user menu instead. -->
    <a th:href="@{/admin/users}" th:if="${showAdminNav}"
      class="btn-cta">
      Users
    </a>
    <a th:href="@{/admin/places}" th:if="${showAdminNav}"
      class="btn-cta">
      Places
    </a>
    <a th:href="@{/admin/plans}" th:if="${showAdminNav}"
      class="btn-cta">
      Plans
    </a>

    <!-- Rutas del usuario común: /for-you es el feed (el home post-login) y /plans su
         listado. /explore es el catálogo. Se muestran en todo el área de usuario, también
         para una sesión ADMIN que la está navegando. -->
    <a th:href="@{/for-you}" th:unless="${showAdminNav}"
      class="btn-cta">
      Para vos
    </a>
    <a th:href="@{/explore}" th:unless="${showAdminNav}"
      class="btn-cta">
      Explore
    </a>
    <a th:href="@{/plans}" th:unless="${showAdminNav}"
      class="btn-cta">
      Plans
    </a>

    <!-- [NOTIF] AC-05: campana con badge de no-leidas. El numero viaja en data-notifications-count
         y se pinta por CSS (::after con attr(), brand.css), no como nodo de texto: el pinneo de
         WebPage.getNavbarItems toma allTextContents y un "3" suelto cambiaria el set esperado de
         todos los E2E del navbar; el pseudo-elemento es texto generado y no entra ahi. El advice
         global (CurrentUserControllerAdvice.unreadNotificationCount) resuelve la cuenta por
         request: marcar desde la pagina descuenta en el render del redirect, sin JS. -->
    <a th:href="@{/notifications}" id="navbar-notifications" data-testid="navbar-notifications"
      aria-label="Notificaciones"
      class="navbar-notifications relative inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-white/10"
      th:attr="data-notifications-count=${unreadNotificationCount}">
      <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </a>

    <!-- [PROF] El avatar pasa de <span> a <button>: abre el menú modal del navbar
         (components/navbar-menu.html, renderizado fuera del <nav> en base.html). Muestra el
         avatarUrl vigente del usuario (userAvatarUrl, resuelto por CurrentUserControllerAdvice)
         y cae a la inicial si no hay: actualizar el perfil se refleja aca en el render del
         redirect, sin JS. La inicial va en un span interno, no en th:text directo del
         <button>: eso reemplazaria todo el contenido del nodo (incluido el <img>). La
         geometría del círculo la manda el botón (overflow-hidden, misma defensa contra el
         max-width del preflight que los botones del avatar-picker). El nombre completo sigue
         viajando en aria-label/title para lectores de pantalla y tooltips. El logout ya no
         vive en el navbar: está en el modal (navbar-menu), así que los helpers E2E que
         pinnearon items no ven un "Logout" suelto que desapareció. -->
    <button type="button" data-menu-toggle="navbar-menu" id="navbar-avatar"
      class="navbar-avatar inline-flex h-9 w-9 items-center justify-center overflow-hidden rounded-full bg-secondary font-serif font-bold text-black hover:ring-2 hover:ring-white/60"
      th:if="${userInitial != null}"
      th:attr="aria-label=${userDisplayName}, title=${userDisplayName}"
      aria-haspopup="true" aria-expanded="false" aria-controls="navbar-menu">
      <span class="relative inline-flex h-full w-full items-center justify-center">
        <!-- La inicial va siempre: si la foto no responde, el onerror se borra a si mismo y el
             disco ya tiene su pareja dibujada underneath. Evita el icono roto en el navbar. -->
        <span th:text="${userInitial}">U</span>
        <img th:if="${userAvatarUrl != null}" th:src="${userAvatarUrl}" alt=""
          onerror="this.remove()" class="absolute inset-0 h-full w-full object-cover" />
      </span>
    </button>

    <!-- [PROF+THEME] El toggle de tema NO vive en este bloque: es un form hijo directo del
         <nav> (mas abajo) para que en mobile quede en la fila del logo, pegado a la
         hamburguesa. El item "Tema" del modal se retiro. -->
  </div>

  <!-- Usuario NO AUTENTICADO: sin hamburguesa (decision fijada en PublicPlansListE2E), asi que
       los links fluyen con flex-wrap en pantallas angostas. order-last + w-full en mobile: el
       bloque baja a su propia fila completa; en desktop, md:order-none + md:ml-auto lo devuelve
       a la derecha. pb-3 en mobile: el nav no tiene padding vertical y esta ultima fila quedaba
       flush contra el canto inferior (los pills azules tocaban el borde con la seccion de
       abajo); md:pb-0 conserva el desktop pixel-identico. El anonimo no tiene ningun control de
       tema: sin sesion, el modo sigue al sistema ([THEME]). -->
  <div sec:authorize="!isAuthenticated()"
    class="order-last md:order-none md:ml-auto w-full md:w-auto flex flex-wrap items-center justify-end gap-x-4 gap-y-1 pb-3 text-sm md:pb-0">
    <a th:href="@{/for-you}"
      class="btn-cta">
      Para vos
    </a>
    <a th:href="@{/auth/register}"
      class="btn-cta">
      Register
    </a>
    <a th:href="${#strings.isEmpty(currentPath)} ? @{/auth/login} : @{/auth/login(redirect=${currentPath})}"
      class="btn-cta btn-cta--alt">
      Login
    </a>

  </div>

  <!-- [PROF+THEME] Toggle de tema: solo con sesion iniciada. Es un form POST a
       /profile/theme (CSRF incluido) porque la preferencia manda sobre localStorage: un
       toggle que solo escriba el storage se revierte en la proxima carga. El hidden del
       tema arranca en el opuesto del modo preferido para que el form funcione sin JS; el
       script de layouts/base lo recalcula al enviar desde data-theme, que es el modo real
       ya aplicado. El redirect vuelve a la pagina actual (admin incluido) y el controller
       lo valida. Hijo directo del nav y order-last: en mobile queda en la fila del logo,
       pegado a la hamburguesa, y en desktop md:order-none lo deja junto al cluster de la
       derecha. El sr-only es el nombre accesible y el texto que leen los helpers E2E. -->
  <form th:action="@{/profile/theme}" method="POST" id="navbar-theme-form"
    sec:authorize="isAuthenticated()" class="order-last md:order-none">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="theme" id="navbar-theme-value"
      th:value="${userThemePreference == 'dark'} ? 'light' : 'dark'">
    <input type="hidden" name="redirect" th:value="${themeRedirectUrl}">
    <button type="submit" data-theme-toggle title="Cambiar tema"
      class="theme-toggle inline-flex items-center justify-center rounded-md bg-primary px-3 py-2 hover:bg-secondary">
      <svg class="theme-icon-moon h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
      <svg class="theme-icon-sun h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <span class="sr-only">Cambiar tema</span>
    </button>
  </form>
</nav>
