<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="summary" id="presupuesto" class="mt-3 p-3 border rounded text-break" aria-labelledby="budget-heading">
  <h3 id="budget-heading" class="h6 fw-bold mb-2">Presupuesto estimado</h3>
  <p class="mb-1" th:if="${plan.budget.estimated}">
    <strong>ARS <span th:text="${#numbers.formatDecimal(plan.budget.minimum, 1, 'POINT', 2, 'COMMA')}"></span><span th:if="${plan.budget.range}"> &ndash; <span th:text="${#numbers.formatDecimal(plan.budget.maximum, 1, 'POINT', 2, 'COMMA')}"></span></span></strong>
  </p>
  <p class="mb-1" th:unless="${plan.budget.estimated}">Sin estimar</p>
  <p class="small text-muted mb-1">Por persona, para todo el recorrido. Valores orientativos en pesos argentinos.</p>
  <p class="small mb-0" style="white-space: pre-line" th:if="${!#strings.isEmpty(plan.budget.notes)}" th:text="${plan.budget.notes}"></p>
</section>
</body>
</html>
