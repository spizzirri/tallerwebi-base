<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variablesColor.css}" />
    <link rel="stylesheet" th:href="@{/css/pago-exitoso.css}" />
</head>
<body>
<div class="card">

    <div class="icono-exito">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>

    <h1>¡Pago exitoso!</h1>
    <p>Gracias por tu compra en el Kiosco. Acá tenés el detalle de tus productos:</p>

    <ul class="lista-pedidos">
        <th:block th:each="pedido : ${pedidos}">
            <li class="fila-hijo">
                <span th:text="'Pedido para: ' + ${pedido.hijo.nombre}">Hijo</span>
                <span th:text="'$' + ${pedido.subtotal}">$0</span>
            </li>
            <li class="fila-item" th:each="item : ${pedido.items}">
                <div class="item-nombre">
                    <strong th:text="${item.producto.nombre}">Nombre</strong>
                    <span class="item-cantidad" th:text="'x' + ${item.cantidad}"></span>
                </div>
                <span class="item-precio" th:text="'$' + ${item.subtotal}">$0</span>
            </li>
        </th:block>
    </ul>

    <div class="acciones">
        <a th:href="@{/home}" class="btn btn-primary">Volver al inicio</a>
        <a th:href="@{/mis-pedidos}" class="btn btn-secondary">Ver mis pedidos</a>
    </div>

</div>
</body>
