<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Plantilla común de todas las páginas de Medipet.
  Uso en cada vista:
    <head th:replace="~{fragments/layout :: head('Título de la pestaña')}"></head>
    <header th:replace="~{fragments/layout :: encabezado('Título', 'Subtítulo')}"></header>
    <main class="mp-main"> ... </main>
    <footer th:replace="~{fragments/layout :: pie}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  Para estilos propios de una página: head(titulo) + un <link> extra después del th:replace.
-->

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title th:text="${titulo} + ' · Medipet'">Medipet</title>
  <link rel="icon" type="image/png" th:href="@{/img/logo.png}">

  <!-- Fuente Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- Estilos comunes de Medipet (colores, encabezado, pie, tarjetas) -->
  <link rel="stylesheet" th:href="@{/css/medipet.css}" />
  <!-- Estilos del contenido de veterinarias y planes (clases propias, no afectan a otras páginas) -->
  <link rel="stylesheet" th:href="@{/css/veterinarias.css}" />
  <link rel="stylesheet" th:href="@{/css/planes.css}" />
</head>

<body>

  <header th:fragment="encabezado(titulo, subtitulo)" class="mp-header">
    <nav class="navbar navbar-expand-lg navbar-dark mp-header__barra">
      <a class="navbar-brand mp-marca" th:href="@{/home}"><img class="mp-marca__logo" th:src="@{/img/logo.png}" alt="" width="44" height="44">Medipet</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
        aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <!-- Socio con sesión iniciada -->
        <th:block th:if="${session.USUARIO_ID != null}">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/home}">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/veterinarias}">Veterinarias</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/servicios}">Servicios</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/planes}">Planes</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/turnos}">Mis turnos</a></li>
          </ul>
          <div class="mp-header__usuario">
            <span class="mp-header__email" th:text="${session.EMAIL}">socio@medipet.com</span>
            <a class="btn mp-btn-claro btn-sm" th:href="@{/turnos/nuevo}">Sacar turno</a>
            <form th:action="@{/logout}" method="POST" class="d-inline">
              <button id="btn-logout" class="btn mp-btn-borde btn-sm" type="submit">Salir</button>
            </form>
          </div>
        </th:block>

        <!-- Visitante sin sesión -->
        <th:block th:unless="${session.USUARIO_ID != null}">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/planes}">Planes</a></li>
          </ul>
          <div class="mp-header__usuario">
            <a class="btn mp-btn-borde btn-sm" th:href="@{/login}">Ingresar</a>
            <a class="btn mp-btn-claro btn-sm" th:href="@{/registro}">Registrarme</a>
          </div>
        </th:block>
      </div>
    </nav>

    <div class="mp-header__titulo">
      <p class="mp-header__eyebrow">Obra social Medipet</p>
      <h1 class="mp-header__h1" th:text="${titulo}">Título</h1>
      <p class="mp-header__subtitulo" th:if="${subtitulo != null}" th:text="${subtitulo}">Subtítulo</p>
    </div>
  </header>

  <footer th:fragment="pie" class="mp-footer">
    <img class="mp-footer__logo" th:src="@{/img/logo.png}" alt="" width="24" height="24">
    <span><strong>Medipet</strong> · Obra social para mascotas · Todos los derechos reservados</span>
  </footer>

  <th:block th:fragment="scripts">
    <!-- Boostrap core js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
  </th:block>

</body>

</html>
