                <a th:href="@{/home}" class="btn-agregar-productos">+ Agregar productos</a>

            <!-- Nueva distribucion -->

            <div th:unless="${#lists.isEmpty(productos)}" class="tabla-wrap">
                <!-- SIN th:action ni method: el submit lo maneja el JS via fetch -->
                <form id="formDistribucion" th:action="@{/distribucion/confirmar}"
                      method="post">

                    <div class="accordion" id="accordionPanelsStayOpenExample">

                        <div class="accordion-item" th:each="producto : ${productos}" th:data-producto-id="${producto.id}">

                            <div class="accordion-header">

                                <button class="accordion-button"
                                        type="button"
                                        data-bs-toggle="collapse"
                                        th:data-bs-target="'#panelsStayOpen-collapse' + ${producto.id}"
                                        aria-expanded="true"
                                        aria-controls="panelsStayOpen-collapseOne">

                                    <div class="container-fluid d-flex align-items-center">

                                        <div class="me-3">
                                            <img th:if="${producto.imagen != null}"
                                                 th:src="${producto.imagen}"
                                                 class="producto-img" alt="">
                                            <img th:unless="${producto.imagen != null}"
                                                 th:src="@{/imagenes/imagenesDefault/caramelo.png}"
                                                 class="producto-img" alt="">
                                        </div>

                                        <div>
                                            <p th:text="${producto.nombre}" class="producto-nombre mb-0"></p>

                                            <p th:text="${producto.precio}" class="producto-precio mb-0">$</p>
                                        </div>
                                    </div>
                                </button>
                            </div>

                            <div th:id="'panelsStayOpen-collapse' + ${producto.id}" class="accordion-collapse collapse show">
                                <div class="accordion-body">

                                    <div th:each="hijo : ${hijos}" class="d-flex p-4 align-items-center border-bottom">
                                        <div class="producto-cell d-flex align-items-center">

                                            <div class="hijo-avatar"
                                                 th:text="${#strings.substring(hijo.nombre,0,1)}">
                                            </div>
                                            <span th:text="${hijo.nombre}" class="ms-3">
                                            </span>
                                        </div>

                                        <div class="ms-auto">
                                            <div class="qty-control" th:data-stock="${producto.cantidad}">
                                                <button type="button" class="qty-btn" onclick="cambiar(this, -1)">−</button>
                                                <input type="hidden"
                                                       th:name="'hijoId'+ ${hijo.id}+'_prodId'+ ${producto.id}"
                                                       th:data-hijo-id="${hijo.id}"
                                                       class="qty-input" th:value="${cantidadesPrevias[hijo.id + '_' + producto.id] ?: 0}">
                                                <span class="qty-num" th:text="${cantidadesPrevias[hijo.id + '_' + producto.id] ?: 0}" ></span>
                                                <button type="button" class="qty-btn" onclick="cambiar(this, 1)">+</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <button type="button" class="btn-trash btn btn-danger d-flex align-items-center mt-4 mb-3"
                                                onclick="eliminarFila(this)"
                                                aria-label="Eliminar producto">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                            </svg>
                                            <p class="mb-0 ms-2">Eliminar producto</p>
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="tabla-footer mt-3">
                        <a th:href="@{/home}" class="btn-agregar-productos">+ Agregar más productos</a>
                        <button type="submit" class="btn-confirmar">
                            Confirmar pedido
                        </button>
                    </div>
                </form>
            </div>

        </section>

</div>

<script th:src="@{/js/distribucion-funciones.js}"></script>
<script th:src="@{/js/drawer.js}"></script>

</body>
</html>
