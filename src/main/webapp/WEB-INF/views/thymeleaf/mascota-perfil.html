<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Perfil de mascota')}"></head>

<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main role="main" class="container">

    <a th:href="@{/home}" class="btn btn-link ps-0 mb-3">&larr; Volver al inicio</a>

    <h1 class="h2 mb-1" th:text="${mascota.nombre}">Firulais</h1>
    <p class="text-muted"
       th:text="${mascota.especie} + (${mascota.raza != null and !#strings.isEmpty(mascota.raza)} ? ' · ' + ${mascota.raza} : '')">PERRO</p>

    <p>
        Plan actual:
        <span class="badge bg-secondary"
              th:text="${mascota.plan != null} ? ${mascota.plan.nombre} : 'Sin plan'">Plan</span>
    </p>

    <form th:action="@{/mascotas/{id}/cambiar-plan(id=${mascota.id})}" method="POST" class="mt-3">
        <label for="planId" class="form-label">Cambiar plan</label>
        <div class="d-flex gap-2">
            <select id="planId" name="planId" class="form-select" style="max-width: 280px;">
                <option th:each="p : ${planes}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${mascota.plan != null and mascota.plan.id == p.id}">Plan</option>
            </select>
            <button type="submit" class="btn btn-primary"
                    th:text="${mascota.plan != null} ? 'Guardar' : 'Asignar plan'">Guardar</button>
        </div>
    </form>

    <form th:if="${mascota.plan != null}" th:action="@{/mascotas/{id}/baja(id=${mascota.id})}" method="POST"
          class="mt-3" onsubmit="return confirm('¿Seguro que querés dar de baja el plan de esta mascota?');">
        <button type="submit" class="btn btn-outline-danger">Dar de baja del plan</button>
    </form>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
