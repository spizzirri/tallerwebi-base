<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Archivos R2</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="mb-4">Gestor de Archivos Cloudflare R2</h1>
        
        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Formulario de subida -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Subir nuevo archivo</h5>
                <form th:action="@{/subir-archivo}" method="post" enctype="multipart/form-data" class="row g-3">
                    <div class="col-auto">
                        <input type="file" name="archivo" class="form-control" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Subir Archivo</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de archivos -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Archivos existentes</h5>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="archivo : ${archivos}">
                            <td th:text="${archivo}">nombre.txt</td>
                            <td>
                                <a th:href="@{'/descargar-archivo/{nombreArchivo}'(nombreArchivo=${archivo})}" class="btn btn-sm btn-outline-success">Descargar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
