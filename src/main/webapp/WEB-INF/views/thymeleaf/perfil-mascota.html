<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Perfil de mascota')}"></head>
  <body>
    <main class="mp-main">
      <h1 th:text="${mascota.nombre}">Nombre</h1>
      <p th:text="${mascota.especie}">Especie</p>
      <p th:text="${mascota.raza}">Raza</p>
      <p
        th:text="${mascota.plan != null} ? ${mascota.plan.nombre} : 'Sin plan'"
      >
        Plan
      </p>
    </main>
  </body>
</html>
