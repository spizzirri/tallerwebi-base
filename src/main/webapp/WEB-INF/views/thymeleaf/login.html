<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main role="main" class="container">

        <div class="container">
            <div id="loginbox" class="mainbox col-md-6 col-sm-8 mx-auto">
                <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
                    <h3 class="form-signin-heading">Ingresar a MediPet</h3>
                    <hr class="colorgraph"><br>

                    <p th:if="${param.registrado != null}" class="alert alert-success">
                        ¡Te registraste! Ya podés ingresar con tu email y contraseña.
                    </p>

                    <label for="email" class="form-label">Email</label>
                    <input th:field="*{email}" id="email" type="email" class="form-control mb-2" required />
                    <label for="password" class="form-label">Contraseña</label>
                    <input th:field="*{password}" type="password" id="password" class="form-control mb-3" required />

                    <button id="btn-login" class="btn btn-lg btn-primary w-100" Type="Submit"
                        disabled>Login</button>

                    <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="'Error ' + ${error}">
                    </p>
                </form>
                <p class="mt-3">¿No tenés cuenta? <a id="btn-register" href="registro">Registrarme</a></p>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
