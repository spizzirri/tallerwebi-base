<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>

<body>

  <header th:replace="~{fragments/layout :: encabezado('Ingresar', 'Gestioná la cobertura y los turnos de tus mascotas.')}"></header>

  <main role="main" class="mp-main mp-main--login">
    <section id="loginbox" class="mp-card">
      <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
        <h2 class="mp-seccion-titulo">Ingresá a tu cuenta</h2>

        <p th:if="${param.registrado != null}" class="alert alert-success">
          ¡Te registraste! Ya podés ingresar con tu email y contraseña.
        </p>

        <label for="email" class="form-label">Email</label>
        <input th:field="*{email}" id="email" type="email" class="form-control mb-3" required />
        <label for="password" class="form-label">Contraseña</label>
        <input th:field="*{password}" type="password" id="password" class="form-control mb-4" required />

        <button id="btn-login" class="btn btn-lg btn-primary w-100" type="submit" disabled>Ingresar</button>

        <p th:if="${error != null}" class="alert alert-danger mt-3 mb-0" th:text="'Error ' + ${error}"></p>
      </form>
      <p class="mt-3 mb-0 text-center">¿No tenés cuenta? <a id="btn-register" href="registro">Registrarme</a></p>
    </section>
  </main>

  <footer th:replace="~{fragments/layout :: pie}"></footer>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
