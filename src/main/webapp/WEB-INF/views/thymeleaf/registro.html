<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Registro')}"></head>

<body>

  <header th:replace="~{fragments/layout :: encabezado('Registrarme como socio', 'Cargá tus datos, los de tu mascota y elegí su plan de cobertura.')}"></header>

  <main role="main" class="mp-main mp-main--angosto">
    <form action="#" th:action="@{/registrarme}" method="POST" th:object="${datosRegistro}">

      <p th:if="${error != null}" class="alert alert-danger" th:text="'Error ' + ${error}"></p>

      <section class="mp-card">
        <h2 class="mp-seccion-titulo">Tus datos</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input th:field="*{nombre}" id="nombre" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="apellido" class="form-label">Apellido</label>
            <input th:field="*{apellido}" id="apellido" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="dni" class="form-label">DNI</label>
            <input th:field="*{dni}" id="dni" class="form-control" inputmode="numeric" pattern="\d{7,8}"
              required />
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input th:field="*{telefono}" id="telefono" type="tel" class="form-control" />
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input th:field="*{email}" id="email" type="email" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="password" class="form-label">Contraseña</label>
            <input th:field="*{password}" id="password" type="password" class="form-control" required />
          </div>
        </div>
      </section>

      <section class="mp-card">
        <h2 class="mp-seccion-titulo">Tu mascota</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombreMascota" class="form-label">Nombre</label>
            <input th:field="*{mascota.nombre}" id="nombreMascota" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="especie" class="form-label">Especie</label>
            <select th:field="*{mascota.especie}" id="especie" class="form-select" required>
              <option value="">Elegí una especie</option>
              <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="raza" class="form-label">Raza</label>
            <input th:field="*{mascota.raza}" id="raza" class="form-control" />
          </div>
          <div class="col-md-4">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input th:field="*{mascota.fechaNacimiento}" id="fechaNacimiento" type="date" class="form-control" />
          </div>
          <div class="col-md-4">
            <label for="peso" class="form-label">Peso (kg)</label>
            <input th:field="*{mascota.peso}" id="peso" type="number" step="0.1" min="0.1" class="form-control" />
          </div>
          <div class="col-12">
            <label for="plan" class="form-label">Plan de cobertura</label>
            <select th:field="*{planId}" id="plan" class="form-select" required>
              <option value="">Elegí un plan</option>
              <option th:each="p : ${planes}" th:value="${p.id}"
                th:text="${p.nombre} + ' — $' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')} + ' por mes'">
              </option>
            </select>
            <div class="form-text">¿No sabés cuál elegir? <a th:href="@{/planes}" target="_blank">Compará los planes</a>.</div>
          </div>
        </div>
      </section>

      <div class="d-flex flex-wrap align-items-center gap-2 mt-4">
        <button id="btn-registrarme" class="btn btn-lg btn-primary" type="submit">Registrarme</button>
        <a th:href="@{/login}" class="btn btn-link">Ya tengo cuenta</a>
      </div>
    </form>
  </main>

  <footer th:replace="~{fragments/layout :: pie}"></footer>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
