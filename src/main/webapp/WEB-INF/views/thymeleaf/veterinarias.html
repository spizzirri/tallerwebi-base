<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Veterinarias')}"></head>

<body>

  <nav th:replace="~{fragments/layout :: nav}"></nav>

  <main role="main" class="container">
    <h1 class="h2">Veterinarias adheridas</h1>

    <form th:action="@{/veterinarias}" method="GET" class="row g-2 align-items-end my-3">
      <div class="col-sm-8 col-md-5">
        <label for="servicioId" class="form-label">Filtrar por servicio</label>
        <select id="servicioId" name="servicioId" class="form-select" onchange="this.form.submit()">
          <option value="">Todos los servicios</option>
          <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre}"
            th:selected="${s.id == servicioId}"></option>
        </select>
      </div>
      <noscript><div class="col-auto"><button class="btn btn-secondary">Filtrar</button></div></noscript>
    </form>

    <p th:if="${#lists.isEmpty(veterinarias)}" class="alert alert-warning">
      No hay veterinarias adheridas que ofrezcan ese servicio.
    </p>

    <div class="row g-3">
      <div class="col-md-6 col-lg-4" th:each="v : ${veterinarias}">
        <article class="card h-100 tarjeta-veterinaria">
          <div class="card-body">
            <h2 class="h5 card-title" th:text="${v.nombre}">Veterinaria</h2>
            <p class="card-text mb-1" th:text="${v.direccion}">Dirección</p>
            <p class="card-text mb-1">Tel: <span th:text="${v.telefono}">4444-4444</span></p>
            <p class="card-text text-muted small"
              th:text="'Lunes a viernes de ' + ${v.horaApertura} + ' a ' + ${v.horaCierre} + ' hs'">Horario</p>
            <div class="d-flex flex-wrap gap-1">
              <span class="badge text-bg-light border" th:each="s : ${v.servicios}"
                th:text="${s.nombre}">Servicio</span>
            </div>
          </div>
          <div class="card-footer bg-transparent border-0 pb-3">
            <a class="btn btn-primary btn-sm" th:href="@{/turnos/nuevo(veterinariaId=${v.id})}">Sacar turno acá</a>
          </div>
        </article>
      </div>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
