<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Veterinarias adheridas')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: encabezado('Veterinarias adheridas', 'Elegí dónde solicitar un turno para tu mascota.')}"></header>

    <main class="mp-main">
      <form th:action="@{/veterinarias}" method="GET" class="veterinarias-filter">
        <label class="veterinarias-filter__label" for="servicioId">Filtrar por servicio</label>
        <select id="servicioId" name="servicioId" class="veterinarias-filter__select" onchange="this.form.submit()">
          <option value="">Todos los servicios</option>
          <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre}"
            th:selected="${s.id == servicioId}"></option>
        </select>
        <noscript><button class="veterinarias-filter__btn" type="submit">Filtrar</button></noscript>
      </form>

      <section
        th:if="${#lists.isEmpty(veterinarias)}"
        class="veterinarias-empty"
        aria-live="polite"
      >
        <div class="veterinarias-empty__icon" aria-hidden="true">🐾</div>
        <h2 class="veterinarias-empty__title">Sin prestadores por ahora</h2>
        <p class="veterinarias-empty__text">
          No hay veterinarias adheridas que ofrezcan ese servicio.
        </p>
      </section>

      <section th:unless="${#lists.isEmpty(veterinarias)}" class="veterinarias-content">
        <div class="veterinarias-search">
          <label class="veterinarias-search__label" for="buscar-veterinaria">
            Buscar por nombre o zona
          </label>
          <input
            id="buscar-veterinaria"
            class="veterinarias-search__input"
            type="search"
            placeholder="Ej: San Roque, San Justo..."
            autocomplete="off"
          />
          <p
            id="veterinarias-sin-resultados"
            class="veterinarias-search__empty"
            hidden
          >
            No encontramos veterinarias con ese criterio.
          </p>
        </div>

        <ul class="veterinarias-list" id="veterinarias-lista">
          <li
            th:each="v : ${veterinarias}"
            class="veterinaria-card"
            th:attr="data-nombre=${v.nombre}, data-direccion=${v.direccion}"
          >
            <div class="veterinaria-card__header">
              <h2 class="veterinaria-card__nombre" th:text="${v.nombre}">Nombre</h2>
              <span
                th:if="${v.atiendeEl(T(java.time.LocalDate).now())}"
                class="veterinaria-card__estado veterinaria-card__estado--abierto"
                >Abierto hoy</span
              >
              <span
                th:unless="${v.atiendeEl(T(java.time.LocalDate).now())}"
                class="veterinaria-card__estado veterinaria-card__estado--cerrado"
                >Cerrado hoy</span
              >
            </div>

            <div class="veterinaria-card__info">
              <p class="veterinaria-card__fila">
                <span class="veterinaria-card__icon" aria-hidden="true">📍</span>
                <span th:text="${v.direccion}">Dirección</span>
              </p>
              <p class="veterinaria-card__fila">
                <span class="veterinaria-card__icon" aria-hidden="true">📞</span>
                <a
                  class="veterinaria-card__telefono"
                  th:href="'tel:' + ${v.telefono}"
                  th:text="${v.telefono}"
                  >Teléfono</a
                >
              </p>
              <p class="veterinaria-card__fila">
                <span class="veterinaria-card__icon" aria-hidden="true">🕐</span>
                <span
                  th:text="'Lunes a viernes de ' + ${v.horaApertura} + ' a ' + ${v.horaCierre} + ' hs'"
                  >Horario</span
                >
              </p>
            </div>

            <div class="veterinaria-card__especialidades">
              <span
                th:each="s : ${v.servicios}"
                class="veterinaria-card__chip"
                th:text="${s.nombre}"
                >Servicio</span
              >
            </div>

            <a
              class="veterinaria-card__turno"
              th:href="@{/turnos/nuevo(veterinariaId=${v.id})}"
              >Sacar turno acá</a
            >
          </li>
        </ul>
      </section>

      <a th:href="@{/home}" class="veterinarias-back">Volver al inicio</a>
    </main>

    <footer th:replace="~{fragments/layout :: pie}"></footer>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/veterinarias.js}"></script>
  </body>
</html>
