name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven build, tests & quality gates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valhalla
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d valhalla"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The view layer's contract (docs/guide-js.md) is a PowerShell grep gate, so it runs on
      # the runner's preinstalled pwsh. Before the Maven build: it takes seconds and it is the
      # cheapest thing that can fail.
      - name: Frontend JS contract
        run: pwsh -File scripts/gate.ps1 js -Strict

      - name: Build, test, and quality gates
        run: mvn clean verify --fail-at-end -DskipITs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: .code-quality/jacoco/
          retention-days: 14

  e2e:
    name: E2E (Playwright against a running Jetty + PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          # A database of its own: ResetDatabase refuses to wipe anything whose name lacks "e2e",
          # so pointing the suite at the app's database would now fail by design. A service
          # container always starts on an empty volume, so naming it here is enough to create it.
          POSTGRES_DB: valhalla_e2e
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d valhalla_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Playwright Chromium
        # Pinned to ${playwright.version} in pom.xml: an unpinned `npx playwright` resolves the
        # latest npm release, which can demand a different Chromium revision than the Java driver.
        # --with-deps installs the host libraries Chromium needs (libgtk-4, harfbuzz, GL...);
        # without it every navigation times out on a bare ubuntu-latest runner.
        run: npx -y playwright@1.61.0 install --with-deps chromium

      - name: Package app (skip tests)
        # The backend job already gated on Prettier/Checkstyle/PMD/CPD, and e2e `needs: backend`.
        # Re-running them here only couples a style violation to the E2E result.
        run: mvn package -DskipTests -Dprettier.skip -Dcheckstyle.skip -Dpmd.skip -Dcpd.skip

      - name: Start Jetty
        run: mvn jetty:run &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: valhalla_e2e
          DB_USER: user
          DB_PASSWORD: user

      - name: Wait for server
        # Probes the app root rather than a login route: a cold runner booting Spring + Jetty
        # needs more than 60s, and a route-coupled probe breaks whenever auth routes move.
        # `-f` makes HTTP 5xx keep the loop waiting, so a DataSource failure surfaces as this
        # timeout rather than as a confusing E2E failure.
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Server did not become ready in 120s" && exit 1

      - name: Run E2E tests
        run: mvn failsafe:integration-test failsafe:verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: valhalla_e2e
          DB_USER: user
          DB_PASSWORD: user

      - name: Stop Jetty
        if: always()
        run: mvn jetty:stop

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          # E2eBase writes a screenshot and a Playwright trace per failing test into
          # target/e2e-artifacts; without this a red E2E run leaves nothing to inspect.
          path: |
            target/failsafe-reports/
            target/e2e-artifacts/
          retention-days: 14
